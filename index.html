<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文獻紀錄系統</title>
<style>
:root{--paper:#f6f4ee;--ink:#253b36;--muted:#738079;--line:#dce1d8;--green:#38634f;--lime:#e7efb4}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 14px}button:hover{background:#edf0e6}button:focus-visible,a:focus-visible{outline:3px solid #93ad65;outline-offset:3px}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#274b3b}.danger{color:#a34138}header{border-bottom:1px solid var(--line);padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:#ffffff90}.brand{font-weight:800;letter-spacing:1px}.brand span{display:inline-grid;place-items:center;background:var(--green);color:var(--lime);width:32px;height:32px;border-radius:8px;margin-right:10px}.small{font-size:12px;color:var(--muted)}main{max-width:1240px;margin:auto;padding:45px 28px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--green);font-weight:700}h1{font-size:40px;letter-spacing:-1px;margin:8px 0}h2,h3,p{margin-top:0}.hero p{color:var(--muted);margin-bottom:0}.hero-note{border-left:2px solid #b6c892;padding-left:20px;font-size:13px;color:var(--muted)}.stats{display:flex;gap:40px;border-bottom:1px solid var(--line);padding:0 0 24px;margin-bottom:30px}.stat strong{font:30px Georgia,serif;margin-right:10px}.stat span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}aside{border-right:1px solid var(--line);padding-right:24px}.side-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:15px}.topic-filter{display:flex;width:100%;justify-content:space-between;text-align:left;margin:5px 0;background:transparent;border-color:transparent;overflow-wrap:anywhere}.topic-filter.active{background:#e5eada;color:var(--green);font-weight:700}.side-footer{margin-top:35px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:9px}.side-footer button{font-size:12px;background:transparent}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:24px}.search{width:100%;max-width:380px}.toolbar .primary{white-space:nowrap}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:2px solid #91aa71;outline-offset:1px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.section-head h2{font-size:21px;margin:0;overflow-wrap:anywhere}.section-head button{padding:4px 8px;font-size:12px;background:transparent}.section{margin-bottom:36px}.subheading{font-size:11px;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin:20px 0 12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{padding:22px;background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;min-height:205px;overflow-wrap:anywhere}.card:hover{border-color:#a4b392}.badge{font-size:10px;background:#edf1e3;color:#54704b;padding:3px 8px;border-radius:5px;display:inline-block;align-self:flex-start}.conference{background:#f5ead7;color:#936c31}.card h3{font-size:17px;line-height:1.5;margin:12px 0 5px}.meta{font-size:12px;color:var(--muted)}.excerpt{font-size:13px;color:#68746d;margin:12px 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;border-top:1px solid #edf0e9;padding-top:12px;gap:8px}.card-foot button{font-size:12px;padding:4px 9px}.empty{text-align:center;padding:42px 20px;border:1px dashed #cbd5c3;border-radius:13px;color:var(--muted)}.empty .icon{font-size:32px;margin-bottom:10px}.empty h3{color:var(--ink);margin-bottom:8px}.empty p{font-size:13px}.intro{background:#e9eddf;border-radius:12px;padding:20px;margin-top:24px;font-size:12px;color:#65765d}footer{max-width:1240px;margin:auto;padding:18px 28px 30px;color:var(--muted);font-size:11px;text-align:center}dialog{border:1px solid var(--line);border-radius:17px;width:min(720px,94vw);max-height:90vh;padding:28px;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#1d302c80;backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:23px}.close{padding:4px 11px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label,.field-label{display:block;font-size:12px;font-weight:650;margin-bottom:5px}textarea{resize:vertical;min-height:85px}.checks{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.checks label{display:flex;gap:6px;align-items:center;margin:0;font-weight:400}.checks input{width:auto}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.details{white-space:pre-wrap;overflow-wrap:anywhere}.details h3{font-size:13px;color:var(--green);margin:22px 0 6px}.details p{margin:0}.details a{color:var(--green)}.notice{font-size:12px;color:#a34138;margin-top:12px}.manage-row{display:flex;gap:8px;align-items:center;margin:10px 0}.manage-row input{min-width:0}.manage-row button{white-space:nowrap;font-size:12px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:10px;z-index:10;max-width:90vw} [hidden]{display:none!important}@media(max-width:760px){main{padding:28px 18px}.hero{align-items:flex-start}.hero-note{display:none}h1{font-size:31px}.layout{grid-template-columns:1fr;gap:20px}aside{border:0;padding:0}.topic-list{display:flex;flex-wrap:wrap;gap:5px}.topic-filter{width:auto;margin:0;gap:12px}.side-footer{display:flex;flex-wrap:wrap;margin-top:15px;padding-top:14px}.side-footer .small{width:100%}.side-title{margin-bottom:10px}.cards{grid-template-columns:1fr}.stats{gap:25px;margin-bottom:22px}.stat strong{font-size:25px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{gap:8px}.toolbar .primary{padding:10px}.hero{margin-bottom:20px}header{padding:14px 18px}header .small{font-size:10px}dialog{padding:20px}.section-head{align-items:flex-start}}
</style></head><body>
<header><div class="brand"><span>▤</span>文獻紀錄系統</div></header>
<main><section class="hero"><div><h1>文獻紀錄系統</h1><p>依主題整理文獻、研究方法與閱讀筆記。</p></div></section>
<div class="stats"><div class="stat"><strong id="paperCount">0</strong><span>篇文獻</span></div><div class="stat"><strong id="topicCount">0</strong><span>個研究主題</span></div><div class="stat"><strong id="confCount">0</strong><span>篇研討會論文</span></div></div>
<div class="layout"><aside><div class="side-title">研究主題 <button id="manageTopics" title="管理主題">＋ 管理</button></div><nav id="topicList" class="topic-list" aria-label="依主題篩選"></nav><div class="side-footer"><button id="exportBtn">↓ 匯出 JSON 備份</button><button id="importBtn">↑ 匯入 JSON 備份</button><input type="file" id="importFile" accept="application/json,.json" hidden><div class="small">資料僅存於此瀏覽器，不會跨裝置同步。清除網站資料前，記得匯出備份。</div></div></aside>
<section><div class="toolbar"><input id="search" class="search" type="search" placeholder="搜尋名稱、作者、方法或可參考的部分…" aria-label="搜尋文獻"><button class="primary" id="addPaper">＋ 新增文獻</button></div><div id="content"></div></section></div></main><footer>文獻紀錄系統</footer>
<dialog id="paperDialog" aria-labelledby="paperHeading"><div class="modal-head"><h2 id="paperHeading">新增文獻</h2><button class="close" type="button" data-close="paperDialog" aria-label="關閉">×</button></div><form id="paperForm"><div class="grid"><div class="full"><label for="title">論文名稱 *</label><input id="title" required maxlength="500"></div><div class="full"><div class="field-label">所屬主題 *（可複選）</div><div id="topicChecks" class="checks"></div><button type="button" id="quickTopic" style="margin-top:8px;font-size:12px">＋ 新增主題</button><div id="quickTopicPanel" hidden style="margin-top:12px"><label for="quickTopicName">新主題名稱</label><div class="manage-row"><input id="quickTopicName" maxlength="80" placeholder="輸入研究主題"><button type="button" id="quickTopicSave" class="primary">新增並選取</button><button type="button" id="quickTopicCancel">取消</button></div><p id="quickTopicError" class="notice" role="alert"></p></div></div><div><label for="type">文獻類型 *</label><select id="type"><option value="journal">期刊論文</option><option value="conference">研討會論文</option><option value="other">其他</option></select></div><div id="conferenceField" hidden><label for="conference">研討會名稱</label><input id="conference" maxlength="300"></div><div><label for="authors">作者</label><input id="authors" maxlength="500"></div><div><label for="year">發表年份</label><input id="year" type="number" min="1000" max="9999" placeholder="例如 2026"></div><div class="full"><label for="url">論文連結（https:// 或 http://）</label><input id="url" type="url" placeholder="https://doi.org/…"></div><div class="full"><label for="question">目的</label><textarea id="question"></textarea></div><div class="full"><label for="method">研究方法</label><textarea id="method"></textarea></div><div class="full"><label for="results">結論</label><textarea id="results"></textarea></div><div class="full"><label for="notes">可參考的部分</label><textarea id="notes"></textarea></div></div><p id="formError" class="notice" role="alert"></p><div class="form-actions"><button type="button" data-close="paperDialog">取消</button><button type="submit" class="primary">儲存文獻</button></div></form></dialog>
<dialog id="topicsDialog" aria-labelledby="topicsHeading"><div class="modal-head"><h2 id="topicsHeading">整理研究主題</h2><button class="close" data-close="topicsDialog" aria-label="關閉">×</button></div><p class="small">重新命名會同步更新所有文獻。刪除主題會保留文獻，沒有其他主題的文獻將移至「未分類」。</p><form id="topicForm" class="manage-row"><input id="newTopic" required maxlength="80" placeholder="輸入新的研究主題" aria-label="新主題名稱"><button class="primary">新增</button></form><div id="topicRows"></div></dialog>
<dialog id="detailDialog" aria-labelledby="detailHeading"><div class="modal-head"><h2 id="detailHeading">文獻筆記</h2><button class="close" data-close="detailDialog" aria-label="關閉">×</button></div><div id="detailContent" class="details"></div><div class="form-actions"><button id="detailDelete" class="danger">刪除文獻</button><button id="detailEdit" class="primary">編輯筆記</button></div></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='paper-memory-v1';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(), fields=['title','type','conference','authors','year','url','question','method','results','notes'];
let state={version:1,topics:[],papers:[]}, active='all', editing=null, viewing=null, timer;
function validate(s){if(!s||s.version!==1||!Array.isArray(s.topics)||!Array.isArray(s.papers))throw Error('備份格式不正確');const ids=new Set(),names=new Set();for(const t of s.topics){if(!t||typeof t.id!=='string'||!t.id||['all','uncategorized'].includes(t.id)||ids.has(t.id)||typeof t.name!=='string'||!t.name.trim()||names.has(t.name.trim()))throw Error('主題資料不正確');ids.add(t.id);names.add(t.name.trim())}const pids=new Set();for(const p of s.papers){if(!p||typeof p.id!=='string'||!p.id||pids.has(p.id)||typeof p.title!=='string'||!p.title.trim()||!['journal','conference','other'].includes(p.type)||!Array.isArray(p.topics)||p.topics.some(id=>!ids.has(id)))throw Error('文獻資料不正確');for(const f of fields)if(p[f]!==undefined&&typeof p[f]!=='string')throw Error('文獻欄位不正確');if(p.url&&!safeUrl(p.url))throw Error('文獻連結必須使用 http 或 https');if(p.year&&!/^[1-9]\d{3}$/.test(p.year))throw Error('年份格式不正確');pids.add(p.id)}return s}
function safeUrl(v){try{return ['http:','https:'].includes(new URL(v).protocol)}catch{return false}}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,4500)}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));state=next;render();return true}catch{toast('無法儲存：瀏覽器儲存空間不足或已停用。請先匯出備份。');return false}}
try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch{setTimeout(()=>toast('原有資料無法讀取，未覆寫原始內容。請先匯出或檢查瀏覽器儲存設定。'),0)}
const typeName={journal:'期刊論文',conference:'研討會論文',other:'其他文獻'};
function render(){if(active!=='all'&&active!=='uncategorized'&&!state.topics.some(t=>t.id===active))active='all';$('paperCount').textContent=state.papers.length;$('topicCount').textContent=state.topics.length;$('confCount').textContent=state.papers.filter(p=>p.type==='conference').length;const filters=[{id:'all',name:'全部文獻'},...state.topics,{id:'uncategorized',name:'未分類'}];$('topicList').innerHTML=filters.map(t=>`<button class="topic-filter ${active===t.id?'active':''}" data-filter="${esc(t.id)}" aria-pressed="${active===t.id}"><span>${esc(t.name)}</span><span>${state.papers.filter(p=>t.id==='all'||(t.id==='uncategorized'?!p.topics.length:p.topics.includes(t.id))).length}</span></button>`).join('');const query=$('search').value.trim().toLocaleLowerCase();const found=state.papers.filter(p=>fields.some(f=>String(p[f]||'').toLocaleLowerCase().includes(query)));let groups=active==='all'?[...state.topics,...(state.papers.some(p=>!p.topics.length)?[{id:'uncategorized',name:'未分類'}]:[])]:filters.filter(t=>t.id===active);let any=false;let html=groups.map(t=>{const papers=found.filter(p=>t.id==='uncategorized'?!p.topics.length:p.topics.includes(t.id));if(query&&!papers.length)return '';if(papers.length)any=true;return `<section class="section"><div class="section-head"><h2>${esc(t.name)} <span class="small">/ ${papers.length} 篇</span></h2></div>${papers.length?['journal','conference'].map(category=>{const list=papers.filter(p=>category==='conference'?p.type==='conference':p.type!=='conference');return `<div class="subheading">${category==='conference'?'◈ 研討會論文':'▤ 期刊 / 其他文獻'} · ${list.length}</div>${list.length?`<div class="cards">${list.map(card).join('')}</div>`:'<p class="small">此分區尚無文獻</p>'}`}).join(''):'<div class="empty"><h3>此主題尚無文獻</h3><p>點選「新增文獻」，建立文獻紀錄。</p></div>'}</section>`}).join('');if(!groups.length||query&&!any)html=`<div class="empty"><div class="icon">▤</div><h3>${query?'沒有找到符合的文獻':'尚無文獻紀錄'}</h3><p>${query?'試試其他關鍵字，或切換研究主題。':'先建立一個主題，再留下第一篇論文的閱讀筆記。'}</p>${query?'':'<button class="primary" id="emptyStart">＋ 建立第一篇筆記</button>'}</div>`;$('content').innerHTML=html}
function card(p){return `<article class="card"><span class="badge ${p.type==='conference'?'conference':''}">${typeName[p.type]}</span><h3>${esc(p.title)}</h3><div class="meta">${esc([p.authors,p.year].filter(Boolean).join(' · ')||'尚未填寫作者與年份')}</div>${p.type==='conference'&&p.conference?`<div class="meta">◈ ${esc(p.conference)}</div>`:''}<p class="excerpt">${esc(p.question||p.method||p.notes||'尚未填寫目的、研究方法或可參考的部分。')}</p><div class="card-foot"><span class="small">${p.topics.length>1?`歸屬 ${p.topics.length} 個主題`:'閱讀筆記'}</span><button data-view="${esc(p.id)}">開啟筆記 ↗</button></div></article>`}
function checks(selected=[]){$('topicChecks').innerHTML=state.topics.length?state.topics.map(t=>`<label><input type="checkbox" name="topics" value="${esc(t.id)}" ${selected.includes(t.id)?'checked':''}>${esc(t.name)}</label>`).join(''):'<span class="small">尚無主題，請先新增一個。</span>'}
function openPaper(id=null){editing=id;$('paperForm').reset();$('quickTopicPanel').hidden=true;$('quickTopic').setAttribute('aria-expanded','false');$('quickTopicError').textContent='';$('formError').textContent='';const p=state.papers.find(p=>p.id===id);$('paperHeading').textContent=p?'編輯文獻':'新增文獻';if(p)for(const f of fields)$(f).value=p[f]||'';checks(p?p.topics:state.topics.some(t=>t.id===active)?[active]:[]);$('conferenceField').hidden=$('type').value!=='conference';$('paperDialog').showModal()}
$('type').onchange=()=>$('conferenceField').hidden=$('type').value!=='conference';
$('paperForm').onsubmit=e=>{e.preventDefault();const p={id:editing||uid(),topics:[...document.querySelectorAll('#topicChecks input:checked')].map(i=>i.value)};for(const f of fields)p[f]=$(f).value.trim();if(!p.title||!p.topics.length){$('formError').textContent='請填寫論文名稱，並至少選擇一個主題。';return}if(p.url&&!safeUrl(p.url)){$('formError').textContent='論文連結須以 http:// 或 https:// 開頭。';return}if(p.type!=='conference')p.conference='';const next=structuredClone(state);if(editing)next.papers=next.papers.map(x=>x.id===editing?p:x);else next.papers.unshift(p);if(save(next)){$('paperDialog').close();toast('文獻已儲存。')}else $('formError').textContent='儲存失敗，表單內容已保留。'};
function addTopic(name){name=name.trim();if(!name||name.length>80){toast('主題名稱需為 1～80 個字。');return null}if(state.topics.some(t=>t.name===name)){toast('已有相同名稱的主題。');return null}const t={id:uid(),name};return save({...state,topics:[...state.topics,t]})?t.id:null}
$('quickTopic').setAttribute('aria-controls','quickTopicPanel');
$('quickTopic').setAttribute('aria-expanded','false');
$('quickTopic').onclick=()=>{$('quickTopicPanel').hidden=false;$('quickTopic').setAttribute('aria-expanded','true');$('quickTopicError').textContent='';$('quickTopicName').focus()};
$('quickTopicCancel').onclick=()=>{$('quickTopicPanel').hidden=true;$('quickTopic').setAttribute('aria-expanded','false');$('quickTopicName').value='';$('quickTopicError').textContent='';$('quickTopic').focus()};
$('quickTopicSave').onclick=()=>{const name=$('quickTopicName').value.trim();if(!name){$('quickTopicError').textContent='請輸入主題名稱。';return}if(state.topics.some(t=>t.name===name)){$('quickTopicError').textContent='已有相同名稱的主題。';return}const selected=[...document.querySelectorAll('#topicChecks input:checked')].map(i=>i.value);const id=addTopic(name);if(id){checks([...selected,id]);$('quickTopicName').value='';$('quickTopicPanel').hidden=true;$('quickTopic').setAttribute('aria-expanded','false');$('quickTopic').focus()}else $('quickTopicError').textContent='無法儲存主題，請檢查瀏覽器儲存空間。'};
$('quickTopicName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('quickTopicSave').click()}};

function topicRows(){$('topicRows').innerHTML=state.topics.map(t=>`<div class="manage-row"><input value="${esc(t.name)}" maxlength="80" aria-label="主題名稱" data-topic-input="${esc(t.id)}"><button data-rename="${esc(t.id)}">改名</button><button class="danger" data-delete-topic="${esc(t.id)}">刪除</button></div>`).join('')||'<p class="small">尚未建立主題。</p>'}
$('manageTopics').onclick=()=>{topicRows();$('topicsDialog').showModal()};$('topicForm').onsubmit=e=>{e.preventDefault();if(addTopic($('newTopic').value)){$('newTopic').value='';topicRows()}};
$('topicRows').onclick=e=>{const rename=e.target.dataset.rename,del=e.target.dataset.deleteTopic;if(rename){const name=[...document.querySelectorAll('[data-topic-input]')].find(x=>x.dataset.topicInput===rename).value.trim();if(!name||state.topics.some(t=>t.id!==rename&&t.name===name)){toast('名稱不可空白或重複。');return}if(save({...state,topics:state.topics.map(t=>t.id===rename?{...t,name}:t)}))topicRows()}if(del&&confirm('刪除此主題？文獻會保留，沒有其他主題的文獻將移至「未分類」。')){const next=structuredClone(state);next.topics=next.topics.filter(t=>t.id!==del);next.papers.forEach(p=>p.topics=p.topics.filter(t=>t!==del));if(save(next))topicRows()}};
function view(id){const p=state.papers.find(p=>p.id===id);if(!p)return;viewing=id;$('detailContent').innerHTML=`<span class="badge">${typeName[p.type]}</span><h2 style="margin-top:14px">${esc(p.title)}</h2><p class="meta">${esc([p.authors,p.year].filter(Boolean).join(' · '))}</p><p class="meta">主題：${esc(p.topics.map(id=>state.topics.find(t=>t.id===id)?.name).join('、')||'未分類')}</p>${p.type==='conference'?`<h3>研討會名稱</h3><p>${esc(p.conference||'尚未填寫')}</p>`:''}${[['question','目的'],['method','研究方法'],['results','結論'],['notes','可參考的部分']].map(([f,n])=>`<h3>${n}</h3><p>${esc(p[f]||'尚未填寫')}</p>`).join('')}${p.url&&safeUrl(p.url)?`<h3>原文連結</h3><a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)} ↗</a>`:''}`;$('detailDialog').showModal()}
$('detailEdit').onclick=()=>{$('detailDialog').close();openPaper(viewing)};$('detailDelete').onclick=()=>{if(confirm('確定刪除此文獻？此操作無法復原。')&&save({...state,papers:state.papers.filter(p=>p.id!==viewing)})){$('detailDialog').close();toast('文獻已刪除。')}};
$('topicList').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){active=b.dataset.filter;render()}};$('content').onclick=e=>{const b=e.target.closest('[data-view]');if(b)view(b.dataset.view);if(e.target.closest('#emptyStart'))openPaper()};$('addPaper').onclick=()=>openPaper();$('search').oninput=render;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('exportBtn').onclick=()=>{let raw;try{raw=localStorage.getItem(KEY)}catch{}const blob=new Blob([raw||JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`文獻筆記-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('備份已匯出，請妥善保存。')};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('檔案過大，請使用 10 MB 以下備份');const data=validate(JSON.parse(await file.text()));if(confirm(`匯入 ${data.papers.length} 篇文獻與 ${data.topics.length} 個主題，取代目前資料？建議先匯出備份。`)){if(save(data))toast('備份已匯入。')}}catch(error){toast('匯入失敗：'+error.message)}finally{e.target.value=''}};
render();
</script></body></html>
